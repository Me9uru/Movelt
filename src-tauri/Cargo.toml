[package]
name = "movel"
version = "0.1.1"
description = "Movel reader"
authors = ["Me9uru"]
edition = "2021"

[workspace]
members = ["credential-store"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "movel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ammonia = "4"
chrono = { version = "0.4", features = ["clock"] }
flate2 = "1"
moka = { version = "0.12", features = ["future"] }
tauri = { version = "2", features = [] }
tauri-plugin-dev-invoke = "0.2"
tauri-plugin-movel-credentials = { path = "credential-store" }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
rmpv = { version = "1", features = ["with-serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
signalr-client = { git = "https://github.com/Me9uru/rust_signalr_client.git", rev = "c05a5228e66fcd8990966167e3a63d6bcfc18758", features = ["messagepack"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
