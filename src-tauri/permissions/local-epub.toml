[[permission]]
identifier = "allow-import-epub"
description = "Allows importing an EPUB file into the private local library."
commands.allow = ["import_epub"]

[[permission]]
identifier = "allow-get-local-epub-overview"
description = "Allows reading metadata and the table of contents for imported EPUBs."
commands.allow = ["get_local_epub_overview"]

[[permission]]
identifier = "allow-get-local-epub-chapter"
description = "Allows reading a chapter from an imported EPUB."
commands.allow = ["get_local_epub_chapter"]

[[permission]]
identifier = "allow-get-local-epub-asset-data-url"
description = "Allows reading a declared imported EPUB image resource."
commands.allow = ["get_local_epub_asset_data_url"]
