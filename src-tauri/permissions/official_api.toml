[[permission]]
identifier = "allow-official-api"
description = "Allows the window to invoke Movel's typed official API commands."
commands.allow = [
  "login",
  "register",
  "send_register_email",
  "restore_user",
  "set_avatar",
  "sign_in",
  "logout",
  "list_novels",
  "rank_novels",
  "search_novels",
  "get_reader_overview",
  "get_reader_document",
  "save_read_position",
  "list_novel_bookshelf",
  "is_on_novel_bookshelf",
  "set_novel_bookshelf",
  "list_comics",
  "search_comics",
  "list_comic_bookshelf",
  "is_on_comic_bookshelf",
  "set_comic_bookshelf",
  "get_comic_series",
  "get_comic_book",
  "save_comic_read_position",
  "get_comic_chapter_pages",
]
