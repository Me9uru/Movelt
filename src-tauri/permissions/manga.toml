[[permission]]
identifier = "allow-browse-manga"
description = "Allows browsing and searching the configured lnovelApi manga source."
commands.allow = ["browse_manga"]

[[permission]]
identifier = "allow-get-manga"
description = "Allows loading a manga and its chapter list from lnovelApi."
commands.allow = ["get_manga"]

[[permission]]
identifier = "allow-get-manga-chapter-pages"
description = "Allows loading the image URL list of a lnovelApi manga chapter."
commands.allow = ["get_manga_chapter_pages"]

[[permission]]
identifier = "allow-get-manga-page-batch"
description = "Allows loading a batch of lnovelApi manga page URLs."
commands.allow = ["get_manga_page_batch"]
